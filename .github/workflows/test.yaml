name: Test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, test, and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: seed_test
          POSTGRES_PASSWORD: seed_test
          POSTGRES_DB: seed_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seed_test -d seed_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun run test
        env:
          SEED_TEST_DB_PORT: "5432"
      - name: Run Biome
        run: bun run biome ci .
