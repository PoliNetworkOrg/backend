name: Docker Image CI
on:
  push:
    branches:
      - main

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/polinetworkorg/backend:latest

  latex-worker:
    name: Build the LaTeX worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FROM ghcr.io/polinetworkorg/legal-texlive (built by PoliNetworkOrg/legal): the package must grant this
      # repository read access in its settings, since legal is private.
      - name: Build the worker image
        uses: docker/build-push-action@v5
        with:
          file: docker/latex-worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/polinetworkorg/latex-worker:latest
